- name: "youtube-1"
  mitm: "*.googlevideo.com"
  filter:
    url-regex: '(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+)'
  action:
    redirect: "$1$2$3"

- name: "youtube-2"
  mitm:
    - "*.googlevideo.com"
    - "www.youtube.com"
    - "s.youtube.com"
  filters:
    - url-regex: '^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad'
    - url-regex: '^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads'
    - url-regex: '^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking)'
    - url-regex: '^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext'
  action:
    reject: 200

- name: "youtube-res"
  mitm: "youtubei.googleapis.com"
  filter:
    url-regex: '^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$'
  action:
    js-res:
      requires-body: 1
      binary-body-mode: 1
      url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js"

- name: "youtube-req"
  mitm: 
    - "*.googlevideo.com"
    - "youtubei.googleapis.com"
  filters:
    - url-regex: '^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*'
    - url-regex: '^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event'
  action:
    js-req:
      requires-body: 1
      binary-body-mode: 1
      url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js"
